<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Eye</title>
<meta name="theme-color" content="#010109">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #010109; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .modes {
    position: fixed; top: 14px; left: 0; right: 0; z-index: 2;
    width: max-content; margin: 0 auto;
    transform: translateY(-8px);
    display: flex; gap: 2px; padding: 3px;
    max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none;
    background: rgba(4, 7, 30, 0.55);
    border: 1px solid rgba(140, 190, 255, 0.18);
    border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity .8s ease, transform .8s ease;
  }
  .modes::-webkit-scrollbar { display: none; }
  body.awake .modes { opacity: 1; pointer-events: auto; transform: none; }
  .modes button {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 5px 12px; border: 1px solid transparent; border-radius: 999px;
    background: transparent; color: rgba(205, 220, 255, 0.72);
    font: 500 11.5px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .03em;
    cursor: pointer; transition: color .2s, background .2s, border-color .2s, box-shadow .2s;
  }
  .modes button:hover { color: #fff; background: rgba(120, 170, 255, 0.1); }
  .modes button:focus-visible { outline: 2px solid #8ff0ff; outline-offset: 2px; }
  .modes button[aria-pressed="true"] {
    color: #eaffff; background: rgba(90, 220, 255, 0.14);
    border-color: rgba(130, 240, 255, 0.55);
    box-shadow: 0 0 12px rgba(90, 220, 255, 0.3), inset 0 0 8px rgba(90, 220, 255, 0.15);
  }
  .modes .k {
    font-size: 9.5px; color: rgba(140, 200, 255, 0.55);
    border: 1px solid rgba(140, 200, 255, 0.25); border-radius: 4px; padding: 1px 4px;
  }
  .modes button[aria-pressed="true"] .k { color: #9ff3ff; border-color: rgba(150, 240, 255, 0.5); }

  .modes .sep { flex: none; width: 1px; margin: 4px 4px; background: rgba(140, 200, 255, 0.25); }
  .modes button.special { color: rgba(255, 214, 160, 0.8); }
  .modes button.special:hover { color: #fff3e0; }
  .modes button.special[aria-pressed="true"] {
    color: #fff4e3; background: rgba(255, 180, 90, 0.14); border-color: rgba(255, 200, 130, 0.55);
    box-shadow: 0 0 12px rgba(255, 170, 80, 0.3), inset 0 0 8px rgba(255, 170, 80, 0.12);
  }
  .modes button.special .k { color: rgba(255, 200, 140, 0.6); border-color: rgba(255, 200, 140, 0.3); }
  .modes [hidden] { display: none; }

  /* model + eye type switch, bottom-right corner (never collides with the mode bar) */
  .corner {
    position: fixed; bottom: 16px; right: 16px; z-index: 3;
    max-width: calc(100vw - 32px);
    opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: opacity .8s ease, transform .8s ease;
    font: 500 11.5px/1 "JetBrains Mono", Consolas, monospace;
  }
  body.awake .corner { opacity: 1; pointer-events: auto; transform: none; }
  .corner-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 7px 12px; border-radius: 999px; cursor: pointer;
    color: #dff8ff; font: inherit; letter-spacing: .03em;
    background: rgba(4, 7, 30, 0.55);
    border: 1px solid rgba(130, 240, 255, 0.4);
    box-shadow: 0 0 12px rgba(90, 220, 255, 0.18);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: border-color .2s, box-shadow .2s;
  }
  .corner-btn:hover, .corner.open .corner-btn { border-color: rgba(150, 245, 255, 0.75); box-shadow: 0 0 16px rgba(90, 220, 255, 0.35); }
  .corner button:focus-visible { outline: 2px solid #8ff0ff; outline-offset: 2px; }
  .corner svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .corner .chev { width: 14px; height: 14px; opacity: .7; transition: transform .2s; }
  .corner .chev { transform: rotate(180deg); }
  .corner.open .chev { transform: none; }
  .corner-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .corner-menu {
    position: absolute; bottom: calc(100% + 6px); right: 0; min-width: 200px;
    display: flex; flex-direction: column; gap: 6px; padding: 6px;
    background: rgba(4, 7, 30, 0.85);
    border: 1px solid rgba(140, 190, 255, 0.22); border-radius: 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity .18s, transform .18s, visibility .18s;
  }
  .corner.open .corner-menu { opacity: 1; visibility: visible; transform: none; }
  .corner .group { display: flex; flex-direction: column; gap: 2px; }
  .corner .group + .group { border-top: 1px solid rgba(140, 190, 255, 0.15); padding-top: 6px; }
  .corner .group p {
    margin: 2px 10px 4px; display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(150, 190, 255, 0.55);
  }
  .corner kbd {
    font: inherit; letter-spacing: 0; padding: 1px 4px; border-radius: 4px;
    border: 1px solid rgba(140, 200, 255, 0.25);
  }
  .corner-menu button {
    display: flex; align-items: center; gap: 8px; text-align: left;
    padding: 7px 10px; border: 0; border-radius: 10px; cursor: pointer;
    background: transparent; color: rgba(205, 220, 255, 0.78); font: inherit;
  }
  .corner-menu button::before {
    content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%;
    border: 1px solid rgba(140, 200, 255, 0.45);
  }
  .corner-menu button:hover { color: #fff; background: rgba(120, 170, 255, 0.1); }
  .corner-menu button[aria-checked="true"] { color: #eaffff; background: rgba(90, 220, 255, 0.12); }
  .corner-menu button[aria-checked="true"]::before { background: #8ff0ff; border-color: #8ff0ff; box-shadow: 0 0 8px #8ff0ff; }

  @media (max-width: 920px) {
    .modes .k { display: none; }
    .modes button { padding: 5px 9px; font-size: 11px; letter-spacing: 0; }
  }
  @media (max-width: 640px) {
    .modes { top: 10px; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="eye"></canvas>
<script src="app.js?v=26"></script>
</body>
</html>
